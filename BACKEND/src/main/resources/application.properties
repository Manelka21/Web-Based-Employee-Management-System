# ============ Server ============
server.port=8080

# ============ MySQL DataSource ============
# Username/password can be overridden with the DB_USERNAME / DB_PASSWORD environment variables.
# No serverTimezone=UTC here: the app and MySQL run on the same machine, so the local
# time zone is used for both and created_at / approved_date values are not shifted.
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (bundled with Spring Boot by default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# schema.sql is run manually in MySQL Workbench (it contains DROP DATABASE),
# so Spring must never run it automatically.
spring.sql.init.mode=never

# ============ JSON ============
spring.jackson.serialization.write-dates-as-timestamps=false

# ============ Logging ============
logging.level.org.springframework=INFO
logging.level.com.lankatech.ems=DEBUG
