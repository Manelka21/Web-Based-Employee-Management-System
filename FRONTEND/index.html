<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFD">
  <meta name="description" content="LankaTech Services employee management system">
  <title>LankaTech EMS</title>

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Type + icons (Google Fonts). Each family is its own request so one failing never blocks the others. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <script src="js/config.js"></script>
  <!-- On/off switches for non-core functions; written by switch-features.bat -->
  <script src="js/features.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="root">
    <div class="boot" aria-label="Loading">
      <img class="boot__mark" src="assets/logo.svg" alt="">
    </div>
  </div>
  <div class="linear-progress" id="progress" role="progressbar" aria-hidden="true"></div>
  <div class="snackbar-host" id="snackbars" aria-live="polite"></div>
  <noscript>LankaTech EMS needs JavaScript enabled.</noscript>
</body>
</html>
